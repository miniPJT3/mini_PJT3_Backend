server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: SafePay-Vault
  
  # 1. 로컬 설정 파일을 포함하도록 추가
  profiles:
    include: local

  # Database 설정 (AWS RDS MySQL)
  datasource:
    url: jdbc:mysql://localhost:3308/mydb?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    # 비밀번호도 환경 변수 처리가 되어있어 안전합니다.
    password: ${RDS_PASSWORD:mysql1234}

  # JPA 및 Hibernate 설정
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
    open-in-view: false

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # OAuth2 설정 (구글 소셜 로그인)
  security:
    oauth2:
      client:
        registration:
          google:
            # application-local.yml의 값을 우선 사용하고, 없으면 기본값 사용
            client-id: 746271667399-ucbm9vc16mc515fqsnqh8v50abpckeu7.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - email
              - profile

  # SQL 초기화 모드
  sql:
    init:
      mode: NEVER

# JWT 커스텀 설정
jwt:
  secret: ${JWT_SECRET_KEY:your_default_secret_key_at_least_32_characters_long_for_security}
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 604800000 # 7일

# 로그 레벨 설정
logging:
  level:
    org.springframework.security: DEBUG
    mini_pjt3.com.team1: DEBUG
    org.hibernate.type.descriptor.sql: TRACE